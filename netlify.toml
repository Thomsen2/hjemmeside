# Æresportskilt.dk/bordkort → bordkort.dk (én 301, ingen kæde).
# _redirects behandles FØR netlify.toml, så samme regler skal også stå der med 301!.
# /bordkort (uden slash) først: Pretty URLs 301'er ellers /bordkort → /bordkort/ før custom redirect.
# /bordkort/ før /bordkort/*, ellers kan splat/mappen bordkort/index.html vinde (200).
[[redirects]]
  from = "/bordkort"
  to = "https://bordkort.dk/"
  status = 301
  force = true

[[redirects]]
  from = "/bordkort/"
  to = "https://bordkort.dk/"
  status = 301
  force = true

[[redirects]]
  from = "/bordkort/*"
  to = "https://bordkort.dk/:splat"
  status = 301
  force = true
