# Host-rewrite skal force=true, ellers vinder root index.html (æresportskilt).
[[redirects]]
  from = "https://bordkort.dk/"
  to = "/bordkort-site/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.bordkort.dk/"
  to = "/bordkort-site/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://bordkort.dk/index.html"
  to = "/bordkort-site/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.bordkort.dk/index.html"
  to = "/bordkort-site/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://bordkort.dk/favicon.svg"
  to = "/favicon-bordkort.ico"
  status = 200
  force = true

[[redirects]]
  from = "https://www.bordkort.dk/favicon.svg"
  to = "/favicon-bordkort.ico"
  status = 200
  force = true

[[redirects]]
  from = "https://bordkort.dk/favicon.ico"
  to = "/favicon-bordkort.ico"
  status = 200
  force = true

[[redirects]]
  from = "https://www.bordkort.dk/favicon.ico"
  to = "/favicon-bordkort.ico"
  status = 200
  force = true
