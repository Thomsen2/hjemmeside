# Æresportskilt.dk/bordkort → bordkort.dk (undgår duplicate content)
[[redirects]]
  from = "/bordkort/*"
  to = "https://bordkort.dk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/bordkort"
  to = "https://bordkort.dk/"
  status = 301
  force = true

# www → non-www (undgår duplicate content)
[[redirects]]
  from = "https://www.bordkort.dk/*"
  to = "https://bordkort.dk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bordkort.dk"
  to = "https://bordkort.dk/"
  status = 301
  force = true

[[redirects]]
  from = "https://bordkort.dk/navne/"
  to = "/bordkort-site/navne/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://bordkort.dk/navne"
  to = "/bordkort-site/navne/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://bordkort.dk/speciale/"
  to = "/bordkort-site/speciale/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://bordkort.dk/speciale"
  to = "/bordkort-site/speciale/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://bordkort.dk/om-os/"
  to = "/bordkort-site/om-os/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://bordkort.dk/om-os"
  to = "/bordkort-site/om-os/index.html"
  status = 200
  force = true

# Host-rewrite skal force=true, ellers vinder root index.html (æresportskilt).
[[redirects]]
  from = "https://bordkort.dk/"
  to = "/bordkort-site/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://bordkort.dk/index.html"
  to = "/bordkort-site/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://bordkort.dk/favicon.svg"
  to = "/favicon-bordkort.ico"
  status = 200
  force = true

[[redirects]]
  from = "https://bordkort.dk/favicon.ico"
  to = "/favicon-bordkort.ico"
  status = 200
  force = true
